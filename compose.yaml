services:
  workbench:
    build:
      context: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-60000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_TOTAL_UPLOAD_MB: ${MAX_TOTAL_UPLOAD_MB:-25}
      MAX_INPUT_TOKENS: ${MAX_INPUT_TOKENS:-100000}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-8192}
      MAX_TOOL_ROUNDS: ${MAX_TOOL_ROUNDS:-6}
    volumes:
      - polyglot-data:/app/data
    init: true
    restart: unless-stopped

volumes:
  polyglot-data:
